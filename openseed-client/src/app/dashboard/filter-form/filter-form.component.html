<div class="filter-container">
  <form [formGroup]="filterForm" (keydown.enter)="searchIssues()" class="filter-form-content">

    <div class="scrollable-fields compact-scroll">

      <!-- GENERAL SECTION -->
      <div class="filter-section">
        <div class="section-header" [ngClass]="{'active': expandedSections[0]}" (click)="toggleSection(0)"
          style="cursor: pointer;">
          <span>{{ 'GENERAL' | translate }}</span>
          <i class="fa-solid" [ngClass]="expandedSections[0] ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
        </div>
        <div class="section-content" *ngIf="expandedSections[0]">
          <div class="metric-group vertical">
            <span class="sub-label">{{ 'LANGUAGE' | translate }}</span>
            <div class="language-pills-sidebar">
              <span class="pill-sidebar" *ngFor="let lang of languages"
                [ngClass]="{'active': isLanguageSelected(lang.value)}" (click)="toggleLanguage(lang.value)">
                {{ lang.label | translate }}
                <i class="fa-solid" [ngClass]="isLanguageSelected(lang.value) ? 'fa-xmark' : 'fa-plus'"></i>
              </span>
            </div>
          </div>
          <div class="metric-group vertical">
            <span class="sub-label">{{ 'CATEGORY' | translate }}</span>
            <select formControlName="category" class="form-input modern-select" title="Category"
              [ngClass]="{'disabled-input': filterForm.get('category')?.disabled}">
              <option value="all" disabled selected hidden>{{ 'CATEGORY_ALL' | translate }}</option>
              <option *ngFor="let category of categories" [value]="category.value">
                {{ category.label | translate }}
              </option>
            </select>
          </div>
        </div>
      </div>

      <!-- REPOSITORY STATS SECTION -->
      <div class="filter-section">
        <div class="section-header" [ngClass]="{'active': expandedSections[1]}" (click)="toggleSection(1)"
          style="cursor: pointer;">
          <span>{{ 'REPOSITORY_STATS' | translate }}</span>
          <i class="fa-solid" [ngClass]="expandedSections[1] ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
        </div>
        <div class="section-content" *ngIf="expandedSections[1]">
          <div class="metric-group vertical">
            <span class="sub-label">STARS RANGE</span>
            <div class="form-row flush range-row">
              <input type="number" formControlName="minStars" placeholder="Min" class="form-input modern-input small">
              <input type="number" formControlName="maxStars" placeholder="Max" class="form-input modern-input small">
            </div>
          </div>

          <div class="metric-group vertical">
            <span class="sub-label">FORKS RANGE</span>
            <div class="form-row flush range-row">
              <input type="number" formControlName="minForks" placeholder="Min" class="form-input modern-input small">
              <input type="number" formControlName="maxForks" placeholder="Max" class="form-input modern-input small">
            </div>
          </div>
        </div>
      </div>

      <!-- PROJECT DETAILS SECTION -->
      <div class="filter-section">
        <div class="section-header" [ngClass]="{'active': expandedSections[2]}" (click)="toggleSection(2)"
          style="cursor: pointer;">
          <span>{{ 'PROJECT_DETAILS' | translate }}</span>
          <i class="fa-solid" [ngClass]="expandedSections[2] ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
        </div>
        <div class="section-content" *ngIf="expandedSections[2]">
          <div class="metric-group vertical">
            <span class="sub-label">ISSUE TITLE</span>
            <input type="text" formControlName="title" placeholder="Search titles..." class="form-input modern-input">
          </div>

          <div class="metric-group vertical">
            <span class="sub-label">LICENSE</span>
            <select formControlName="license" class="form-input modern-select">
              <option value="all" disabled selected hidden>All Licenses</option>
              <option *ngFor="let license of licenses" [value]="license.value">
                {{ license.label | translate}}
              </option>
            </select>
          </div>

          <div class="inline-toggle compact end-toggle">
            <span class="sub-label mb-0">BOOKMARKS ONLY</span>
            <label class="switch-toggle" title="Show Bookmarks Only">
              <input type="checkbox" formControlName="isOnlyBookmarks">
              <span class="slider-round"></span>
            </label>
          </div>
        </div>
      </div>

    </div>

    <!-- Pinned Actions -->
    <div class="form-bottom-actions compact-actions">
      <div class="form-actions">
        <button class="btn-primary mockup-green" type="button" (click)="searchIssues()">
          APPLY FILTER
        </button>
        <button class="btn-icon dark-reset" type="button" (click)="resetFormToDefault()" title="Reset Filters">
          <i class="fa-solid fa-rotate-right"></i>
        </button>
      </div>
    </div>

  </form>
</div>
